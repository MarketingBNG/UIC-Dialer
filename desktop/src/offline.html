<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self'" />
    <title>UIC Dialer</title>
    <style>
      body { margin: 0; height: 100vh; display: grid; place-items: center; background: #f5f7fb; color: #0f172a;
        font: 15px/1.5 "Segoe UI", system-ui, sans-serif; }
      .card { max-width: 26rem; padding: 2rem; text-align: center; }
      img { width: 56px; height: 56px; margin-bottom: 1rem; }
      h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
      p { margin: .25rem 0; color: #475569; }
      .reason { font-size: 12px; color: #94a3b8; margin-top: 1rem; }
      button { margin-top: 1.25rem; padding: .6rem 1.4rem; border: 0; border-radius: 999px; background: #1e4f8c;
        color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
      button:hover { background: #173f70; }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="../build/icon.png" alt="" />
      <h1>Can't reach UIC Dialer</h1>
      <p>Check your internet connection. Calls and outcomes already saved are safe.</p>
      <p id="count"></p>
      <button id="retry" type="button">Retry now</button>
      <p class="reason" id="reason"></p>
    </div>
    <script>
      // Shown by the app when the dashboard can't load. The app also reloads by itself when the countdown ends.
      const q = new URLSearchParams(location.search);
      const target = q.get("target") || "";
      let left = Math.max(1, Math.round(Number(q.get("wait") || 5000) / 1000));
      document.getElementById("reason").textContent = q.get("reason") || "";
      const count = document.getElementById("count");
      const tick = () => { count.textContent = `Trying again in ${left}s…`; left = Math.max(0, left - 1); };
      tick();
      setInterval(tick, 1000);
      document.getElementById("retry").addEventListener("click", () => {
        count.textContent = "Connecting…";
        if (/^https?:\/\//.test(target)) location.href = target;
      });
    </script>
  </body>
</html>
