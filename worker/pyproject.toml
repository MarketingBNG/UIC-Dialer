[project]
name = "uic-worker"
version = "0.1.0"
description = "UIC Dialer transcription worker: claims jobs from the API and posts transcripts back."
requires-python = ">=3.13,<3.14"
dependencies = [
  "anthropic==2.13.0",
  "httpx==0.28.1",
  "numpy==2.5.5",
  "onnxruntime==1.32.0",
  "structlog==26.1.0",
  "tenacity==9.2.1",
]

[dependency-groups]
dev = ["pytest==9.2.0", "respx==0.23.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
